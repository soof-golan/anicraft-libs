[package]
name = "anim-shape"
description = "Animate's edge-based vector shapes: XFL edge strings, fill and stroke styles, region assembly and display nodes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anim-core = { workspace = true }
anim-display = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[[bench]]
name = "shape"
harness = false

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
# Sample-gated tests read the FLA zips by local file headers (their central directory is 54 bytes short).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
proptest = { workspace = true }
# The preview test (tests/preview.rs) reads the sample XML and rasterises shapes to PNG contact sheets.
roxmltree = "0.21"
serde_json = { workspace = true }
tiny-skia = { workspace = true, features = ["png-format"] }
