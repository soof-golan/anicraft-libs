[package]
name = "anim-ui"
description = "Shared egui widgets for AniCraft and CharCraft: stage view, timeline, layers, property grid, library, transport, toolbar, docking and theme"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anim-core = { workspace = true }
craft-ui = { workspace = true }
egui = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Visual reordering of right-to-left runs: egui's text shaper lays glyphs out in logical order.
unicode-bidi = "0.3"

[dev-dependencies]
# wgpu renders the gallery test to a PNG (software Vulkan is enough); the other tests need no GPU.
egui_kittest = { version = "0.36", features = ["wgpu"] }
image = { workspace = true }
proptest = { workspace = true }
